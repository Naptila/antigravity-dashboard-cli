name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check modules and scripts
        run: npm run check

      - name: Verify manifest version sync
        run: node scripts/release-bump.mjs --check

      - name: Run unit and integration tests
        run: npm test

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Validate Antigravity plugin
        run: |
          node scripts/release-bump.mjs --validate-plugin
          if command -v agy >/dev/null 2>&1; then
            agy plugin validate .
          fi
